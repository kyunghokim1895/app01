name: Daily All News Summary Update

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시 (UTC 21:00)
  workflow_dispatch:

jobs:
  update-all:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install dependencies
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 -m pip install --upgrade pip
          python3 -m pip install -U youtube-transcript-api google-generativeai google-api-python-client yt-dlp python-dotenv
          python3 -m pip install -U yt-dlp

      - name: Run Master Processor (Update All Apps)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 src/master_processor.py --app all
          echo "==== Check for data modifications ===="
          git status

      - name: Commit and Push changes
        run: |
          git config --global pull.rebase true
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage changes
          git add -f SentvSummaryApp/src/services/data.json MKSummaryApp/src/services/data.json HKKoreaApp/src/services/data.json JipconomyApp/src/services/data.json HKGlobalApp/src/services/data.json 2>/dev/null || true
          git add -f crawler/summaries.db mk_crawler/summaries.db hk_global_crawler/summaries.db hk_korea_crawler/summaries.db jipconomy_crawler/summaries.db 2>/dev/null || true
          git add . # Fallback for any other changes
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update all news summaries via Master Processor [$(date +'%Y-%m-%d')]"
            
            # Using a loop to retry push in case of concurrent updates
            # Determine current branch name
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            for i in {1..3}; do
              echo "Attempting push to $BRANCH (attempt $i)..."
              git pull --rebase origin $BRANCH
              if git push origin $BRANCH; then
                echo "Push successful"
                exit 0
              fi
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            done
            echo "Failed to push after 3 attempts"
            exit 1
          fi
