name: Daily All News Summary Update

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시 (UTC 21:00)
  workflow_dispatch:

jobs:
  update-apps:
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        app: [crawler, mk_crawler, hk_global_crawler, hk_korea_crawler, jipconomy_crawler]
    
    # 동일한 앱이 중복 실행되는 것 방지
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install dependencies
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 -m pip install -U youtube-transcript-api google-generativeai google-api-python-client yt-dlp python-dotenv

      - name: Force Sync with Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run Update Script (Parallel Mode)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          chmod +x run_all_updates.sh
          ./run_all_updates.sh ${{ matrix.app }}

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 병렬 작업 간 충돌 방지를 위한 재시도 루프
          for i in {1..15}; do
            git add .
            if git diff --cached --quiet; then
              echo "No changes for ${{ matrix.app }}"
              exit 0
            fi
            
            git commit -m "Auto-update: ${{ matrix.app }} [$(date +'%Y-%m-%d %H:%M')]"
            
            echo "Attempting to sync and push (attempt $i)..."
            # 최신 상태 가져오기
            git fetch origin main
            git rebase origin/main
            
            if git push origin main; then
              echo "Push successful for ${{ matrix.app }}"
              exit 0
            fi
            
            # 충돌 발생 시 리셋 후 다시 시도
            echo "Push conflict, retrying in jittered time..."
            git reset --soft HEAD~1
            git checkout main
            git pull --rebase origin main
            
            # 랜덤 지터 추가 (5~20초)
            SLEEP_TIME=$(( (RANDOM % 15) + 5 ))
            echo "Waiting ${SLEEP_TIME} seconds before retry..."
            sleep $SLEEP_TIME
          done
          echo "Failed to push after 15 attempts"
          exit 1
