name: Daily All News Summary Update

on:
  schedule:
    - cron: '0 21 * * *' # 매일 한국 시간 오전 6시 (UTC 21:00)
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install youtube-transcript-api google-generativeai google-api-python-client yt-dlp python-dotenv

      - name: Run Master Processor (Update All Apps)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python src/master_processor.py --app all

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update all news summaries via Master Processor [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
