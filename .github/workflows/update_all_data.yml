name: Daily All News Summary Update

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시 (UTC 21:00)
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U youtube-transcript-api google-generativeai google-api-python-client yt-dlp python-dotenv
          python -m pip install -U yt-dlp

      - name: Run Master Processor (Update All Apps)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python src/master_processor.py --app all
          echo "==== Check for data modifications ===="
          git status

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Explicitly add all potential data files
          git add -f SentvSummaryApp/src/services/data.json MKSummaryApp/src/services/data.json HKKoreaApp/src/services/data.json JipconomyApp/src/services/data.json HKGlobalApp/src/services/data.json 2>/dev/null || true
          git add -f crawler/summaries.db mk_crawler/summaries.db hk_global_crawler/summaries.db hk_korea_crawler/summaries.db jipconomy_crawler/summaries.db 2>/dev/null || true
          git add . # Fallback for any other changes
          git commit -m "Auto-update all news summaries via Master Processor [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
