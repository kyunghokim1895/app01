name: Daily All News Summary Update

on:
  schedule:
    - cron: "0 1 * * *"  # 매일 한국 시간 오전 10시 (UTC 01:00)
    - cron: "0 7 * * *"  # 매일 한국 시간 오후 4시 (UTC 07:00)
    - cron: "0 11 * * *" # 매일 한국 시간 오후 8시 (UTC 11:00)
  workflow_dispatch:

jobs:
  update-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [crawler, mk_crawler, hk_global_crawler, hk_korea_crawler, jipconomy_crawler, hktv_global_crawler]
    
    # 동일한 앱이 중복 실행되는 것 방지
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          python3 -m pip install -U google-genai google-api-python-client python-dotenv

      - name: Force Sync with Remote
        run: |
          rm -f .git/index.lock
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

      - name: Run Update Script (Parallel Mode)
        run: |
          chmod +x run_all_updates.sh
          ./run_all_updates.sh ${{ matrix.app }} --no-sync

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 병렬 작업 간 충돌 방지를 위한 재시도 루프
          for i in {1..15}; do
            git add .
            if git diff --cached --quiet; then
              echo "No changes for ${{ matrix.app }}"
              exit 0
            fi
            
            git commit -m "Auto-update: ${{ matrix.app }} [$(date +'%Y-%m-%d %H:%M')]"
            
            echo "Attempting to sync and push (attempt $i)..."
            # 최신 상태 가져오기
            git fetch origin main
            git rebase origin/main
            
            if git push origin main; then
              echo "Push successful for ${{ matrix.app }}"
              exit 0
            fi
            
            # 충돌 발생 시 리셋 후 다시 시도
            echo "Push conflict, retrying in jittered time..."
            git reset --soft HEAD~1
            git checkout main
            git pull --rebase origin main
            
            # 랜덤 지터 추가 (5~20초)
            SLEEP_TIME=$(( (RANDOM % 15) + 5 ))
            echo "Waiting ${SLEEP_TIME} seconds before retry..."
            sleep $SLEEP_TIME
          done
          echo "Failed to push after 15 attempts"
          exit 1

  # 모든 크롤러 잡 완료 후, 갱신된 data.json을 Notion("유튜브 영상 아카이브" DB)에 동기화.
  # 영상ID 기준 멱등 처리이므로 이미 올라간 영상은 건너뛴다.
  notion-sync:
    needs: update-apps
    if: ${{ always() }}   # 일부 크롤러가 실패해도 존재하는 data.json은 동기화
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # 채널별 DB ID는 notion_sync.py의 DB_MAP에 하드코딩(토큰 없이는 무의미).
      # 필요 시 NOTION_DATABASE_MAP(JSON) secret으로 덮어쓰기 가능.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Force Sync with Remote
        run: |
          rm -f .git/index.lock
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          python3 -m pip install -U requests python-dotenv

      - name: Sync to Notion
        run: |
          python3 notion_sync.py
